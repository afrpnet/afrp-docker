name: Probe Docker Hub Org Endpoints

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        env:
          DU: ${{ secrets.DOCKER_USERNAME }}
          DP: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          TOKEN=$(curl -s -X POST https://hub.docker.com/v2/users/login/ \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"$DU\",\"password\":\"$DP\"}" | jq -r .token)
          echo "=== whoami ==="
          curl -s -H "Authorization: JWT $TOKEN" https://hub.docker.com/v2/users/me/ | jq '{username,type,full_name,gravatar_email,gravatar_url,subscription,scopes}'
          echo "=== me raw keys ==="
          curl -s -H "Authorization: JWT $TOKEN" https://hub.docker.com/v2/users/me/ | jq -r 'keys | join(",")'
          echo "=== POST /v2/orgs/ (empty body, endpoint check) ==="
          curl -s -o /tmp/o -w "status=%{http_code}\n" -X POST https://hub.docker.com/v2/orgs/ \
            -H "Authorization: JWT $TOKEN" -H 'Content-Type: application/json' -d '{}'
          head -c 400 /tmp/o; echo
          echo "=== GET /v2/orgs/afrpnet/ (exists?) ==="
          curl -s -o /tmp/g -w "status=%{http_code}\n" -H "Authorization: JWT $TOKEN" https://hub.docker.com/v2/orgs/afrpnet/
          head -c 300 /tmp/g; echo
