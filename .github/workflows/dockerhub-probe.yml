name: Probe Docker Hub Repo Fields

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        env:
          DU: ${{ secrets.DOCKER_USERNAME }}
          DP: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          TOKEN=$(curl -s -X POST https://hub.docker.com/v2/users/login/ \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"$DU\",\"password\":\"$DP\"}" | jq -r .token)
          echo "token_len=${#TOKEN}"
          echo "--- authed repo object ---"
          curl -s -H "Authorization: JWT $TOKEN" https://hub.docker.com/v2/repositories/afrp/afrp/ | jq .
          echo "--- authed user object ---"
          curl -s -H "Authorization: JWT $TOKEN" https://hub.docker.com/v2/users/afrp/ | jq .
          echo "--- try logo field ---"
          curl -s -X PATCH https://hub.docker.com/v2/repositories/afrp/afrp/ \
            -H "Authorization: JWT $TOKEN" -H 'Content-Type: application/json' \
            -d '{"logo":"https://raw.githubusercontent.com/afrpnet/afrp-docker/master/logo.png"}' | jq .
