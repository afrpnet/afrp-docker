name: Build & Push Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: crpi-31z6v1rz7y15fca2.cn-beijing.personal.cr.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract version
        id: version
        run: |
          ref="${GITHUB_REF#refs/tags/}"
          if [ "$ref" = "$GITHUB_REF" ]; then
            version="latest"
            display="dev"
          else
            version="${ref#v}"
            display="v${version}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "display=${display}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.display }}
          # ACR 个人版不支持 BuildKit 的 OCI attestation（empty descriptor）清单
          provenance: false
          sbom: false
          tags: |
            afrp/afrp:latest
            afrp/afrp:${{ steps.version.outputs.version }}
            crpi-31z6v1rz7y15fca2.cn-beijing.personal.cr.aliyuncs.com/afrp/afrp:latest
            crpi-31z6v1rz7y15fca2.cn-beijing.personal.cr.aliyuncs.com/afrp/afrp:${{ steps.version.outputs.version }}
