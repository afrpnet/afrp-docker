name: Build & Push Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  ACR_REGISTRY: crpi-31z6v1rz7y15fca2.cn-beijing.personal.cr.aliyuncs.com
  ACR_NAMESPACE: afrp

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to Alibaba Cloud ACR
        if: ${{ secrets.ACR_USERNAME != '' && secrets.ACR_PASSWORD != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract version
        id: version
        run: |
          ref="${GITHUB_REF#refs/tags/}"
          if [ "$ref" = "$GITHUB_REF" ]; then
            ref="${GITHUB_REF#refs/heads/}"
          fi
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            afrp/afrp:latest
            afrp/afrp:${{ steps.version.outputs.version }}

      - name: Build and push to Alibaba Cloud ACR
        if: ${{ secrets.ACR_USERNAME != '' && secrets.ACR_PASSWORD != '' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/afrp:latest
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/afrp:${{ steps.version.outputs.version }}
