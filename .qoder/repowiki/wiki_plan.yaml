version: 1

repowiki:
  template: architecture
  notes:
    - text: "本仓库是 AFRP 内网穿透的 Docker Web 版客户端：Go 1.22 标准库 HTTP 服务（main.go 约 1000 行）+ 单文件原生 HTML/JS 前端（web/index.html 约 1400 行），没有任何前端构建步骤、npm 依赖或第三方 Go 依赖。"
      author: "qoder"
    - text: "全部状态存放在 Docker volume 的 /data 下：主配置 /data/config/config.json、自动生成的 frpc 配置 /data/config/frpc.toml、运行日志 /data/logs/frpc.log。路径常量集中在 main.go 顶部（configDir/configFile/frpcBinary/logFile）。"
      author: "qoder"
    - text: "生产容器重建时必须挂载 -v afrp-data:/data，容器名统一为 afrp-web，端口 8000。漏挂卷会新建匿名卷，表现为「重启后需重新登录、Client Secret 变成未设置、隧道丢失」。"
      author: "qoder"
    - text: "发布流程：本地编译验证 → 提交并打 vX.Y.Z tag → GitHub Actions（.github/workflows/docker.yml）构建并推送 afrp/afrp:latest 与 afrp/afrp:<version> 到 Docker Hub → 手动 SSH 生产服务器重建容器。生产没有自动拉取/自动部署机制。"
      author: "qoder"
    - text: "仓库内 deploy.sh 是生产容器更新脚本，已包含正确的卷挂载命令，可直接 ssh root@<host> 'bash -s' < deploy.sh 使用。"
      author: "qoder"
    - text: "关键事实：官网 API（/api/me.php）只返回 secret_set 布尔值，永远不返回 Client Secret 明文；官网 /api/secret.php 是重置接口，明文仅在重置那一次返回。因此 Client Secret 必须本地按账号缓存，配置在 config.json 的 account_secrets（key 为官网用户名）。"
      author: "qoder"
    - text: "禁用模式：禁止在登录时用官网 me.php 返回的（恒为空的）密钥覆盖本地已保存的 client_secret，这正是早期「重新登录后密钥变未设置」的根因。"
      author: "qoder"
    - text: "frpc 的 auth.oidc.clientID 必须是官网用户名，不是用户登录时输入的账号（可能是邮箱）；用邮箱登录时必须先用 user_info.username 归一化，否则 frpc 认证必然失败。"
      author: "qoder"
    - text: "切换账号时必须先停止旧 frpc 进程，否则它仍用上一个账号的密钥运行；旧版单 client_secret 全局密钥在登录时要归档进对应账号的 account_secrets，避免升级后丢密钥。"
      author: "qoder"
    - text: "服务器选择按账号记忆：后端 config.json 的 account_servers（账号→服务器 ID），前端 localStorage 的 afrp_account_servers（key 为登录 identity）。恢复优先级为：账号本地记忆 > 登录响应 saved_server_id > 旧版 afrp_config.selected_server_id > 服务器列表第一个。"
      author: "qoder"
    - text: "frpc 运行期间锁定服务器下拉框（/api/status 额外返回当前账号的 server_id 用于回显），此时任何切换尝试都不得写入配置或账号记忆；状态需在登录、恢复会话、刷新服务器列表前先获取。"
      author: "qoder"
    - text: "禁用模式：后端 map 的 key 是官网用户名，前端 map 的 key 是登录 identity，两层各自自洽，禁止混用同一份 key 空间。"
      author: "qoder"
    - text: "Dockerfile 为多阶段构建：frpc 二进制直接从 fatedier/frpc:v0.71.1 官方镜像复制，Go 后端在 golang:1.22-alpine 阶段编译，运行镜像为 alpine:3.19。"
      author: "qoder"
    - text: "后端 API 全部挂在 /api 下：login、user、plans、config、secret、tunnels、start、stop、status、log；前端为单页应用，登录页、主页面与若干模态框均写死在一个 HTML 文件内。"
      author: "qoder"
    - text: "仓库内的 deploy-update.txt 含测试账号凭据，已加入 .gitignore，禁止提交或写入 Wiki 页面。"
      author: "qoder"
  documents:
    - title: "项目概览"
      goal: "说明 AFRP Web UI 的定位、整体架构（Go 后端 + 单文件前端 + Docker）、核心能力清单与典型使用流程，让读者不读代码也能理解产品形态。"
    - title: "账号登录与会话管理"
      goal: "讲清登录链路：官网 /api/login.php 凭据登录、用户信息与会员信息获取、OIDC 参数填充、已保存账号列表与活跃会话的前端存储（localStorage 的 afrp_saved_accounts / afrp_active_session）。"
    - title: "Client Secret 按账号管理"
      goal: "解释官网不返回密钥明文这一前提，以及 account_secrets 的按账号存储、旧版全局密钥归档、粘贴/生成/清除三种操作与 frpc.toml 的同步写入。"
    - title: "服务器选择与状态联动"
      goal: "说明 account_servers 记忆机制、saved_server_id 回填、恢复优先级，以及 frpc 运行中锁定下拉框并禁止写入配置的行为。"
    - title: "隧道管理与 frpc 进程控制"
      goal: "覆盖 /api/tunnels 的增删改（按名称覆盖）、隧道类型与表单字段联动（TCP/UDP/HTTP/HTTPS/STCP/SUDP/XTCP），以及 frpc 启动/停止、进程竞态处理、frpc.toml 生成与日志读取。"
    - title: "部署与发布"
      goal: "说明 Docker 镜像构建方式、数据卷布局、必须挂载 afrp-data 的原因、CI 打 tag 触发构建推 Docker Hub、以及生产手动更新容器与备份恢复的完整命令。"
    - title: "API 参考"
      goal: "逐个列出 /api 下各端点的方法、请求参数与返回结构（login/user/plans/config/secret/tunnels/start/stop/status/log）。"

knowledgecard:
  notes:
    - text: "AFRP Web UI = Docker 版内网穿透客户端。Go 1.22 标准库 HTTP 服务 + 单文件原生 HTML/JS 前端，无前端构建与第三方依赖；状态全部落在 /data（config.json、frpc.toml、frpc.log）。"
      author: "qoder"
    - text: "账号维度有三份状态：官网用户名（后端 account_secrets / account_servers 的 key，也是 frpc 的 clientID）、登录 identity（前端 afrp_account_servers 的 key）、当前登录用户（cfg.User）。"
      author: "qoder"
    - text: "官网 API 不返回 Client Secret 明文，密钥只能本地按账号缓存；切换账号必须停掉旧 frpc 进程。"
      author: "qoder"
    - text: "部署红线：生产容器必须挂载 -v afrp-data:/data，容器名 afrp-web，端口 8000；镜像由 v* tag 触发 CI 推送到 Docker Hub，生产需手动重建容器。"
      author: "qoder"
    - text: "frpc 运行期间服务器下拉框锁定，不允许切换节点。"
      author: "qoder"
